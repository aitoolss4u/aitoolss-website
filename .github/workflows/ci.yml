name: CI

on:
  push:
    branches: [main, phase-2-foundation, phase-3-design-system, phase-4-main-website]
  pull_request:
    branches: [main, phase-2-foundation, phase-3-design-system]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
